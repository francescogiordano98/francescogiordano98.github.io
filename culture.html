  <script>

    { type: "Album", title: "In Rainbows", creator: "Radiohead", note: "The one where everything clicks." },
    { type: "Album", title: " ", creator: "Athmosphere", note: " ." },
    { type: "Album", title: " ", creator: "Stokka & Madbuddy", note: " ." },
    { type: "Song", title: "La città vecchia", creator: "Fabrizio De Andrè", note: " ." },
    { type: "Book", title: "Memoires d'Hadrien", creator: "Marguerite Yourcenar", note: " ." },
    { type: "Book", title: "Le città invisibili", creator: "Italo Calvino", note: " ." },

    { type: "Poem", title: " ", creator: " ", note: " ." },
    { type: "Painting", title: "", creator: "Hans Holbein the Younger", note: "A Renaissance masterpiece hiding a skull in plain sight." },
    { type: "Theater", title: "Six Characters in Search of an Author", creator: "Luigi Pirandello", note: "Meta-theater that makes you question what a play even is." },

    { type: "Science", title: "Wikipedia 'list of lists of lists'", creator: "wikipedia", note: "Knowledge and categorization." }
  ];
  // ─────────────────────────────────────────────────────────────

  let lastIndex = -1;

  function draw() {
    let idx;
    do { idx = Math.floor(Math.random() * CULTURE.length); }
    while (CULTURE.length > 1 && idx === lastIndex);
    lastIndex = idx;
    const pick = CULTURE[idx];
    document.getElementById('culture-pick').innerHTML = `
      <div class="culture-card">
        <span class="culture-type">${pick.type}</span>
        <span class="culture-title">${pick.title}</span>
        <span class="culture-creator"> — ${pick.creator}</span>
        <p class="culture-note">${pick.note}</p>
      </div>
    `;
  }

  draw();
  </script>
